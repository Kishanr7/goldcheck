name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Install as a command and run the demo from another folder
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          goldcheck --version
          goldcheck demo --out gc-demo
          set +e
          goldcheck compare --db gc-demo/demo.sqlite --old gc-demo/old_query.sql --new gc-demo/new_query.sql --out gc-demo/compare.html
          test $? -eq 1
      - name: DuckDB engine and official MCP client tests
        run: |
          python -m pip install "duckdb==1.5.6" "mcp==2.3.0"
          python -m unittest tests.test_duck tests.test_mcp_client -v
  postgres:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:17.6
        env:
          POSTGRES_USER: goldcheck
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: goldcheck
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      GOLDCHECK_TEST_PG_URL: postgresql://goldcheck:ci-only-password@localhost:5432/goldcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "psycopg[binary]==3.3.6"
      - run: python -m unittest tests.test_pg -v
